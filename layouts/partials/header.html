<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .IsHome }}A software tinkerer and hacker from Navi Mumbai, India.{{ else }}{{ .Summary | plainify | truncate 155 }}{{ end }}" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
<script>
  // Apply a saved theme choice before the page paints; otherwise the device setting is used.
  try {
    var savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/main.css">

{{ with .OutputFormats.Get "rss" -}}
	{{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
{{ end -}}

<link rel="icon" type="image/jpeg" href="/favicon.ico">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-37Z4WHLLWZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-37Z4WHLLWZ');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body{{ if and .IsPage (eq .Section "blog") }} class="article"{{ end }}>
	<nav class="site-nav" aria-label="Main">
		<div class="nav-links">
			<a href="/"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a> ·
			<a href="/projects/"{{ if eq .Section "projects" }} aria-current="page"{{ end }}>Projects</a> ·
			<a href="https://github.com/sanjayvs1" target="_blank" rel="noopener">Github</a> ·
			<a href="mailto:datromix@gmail.com">datromix@gmail.com</a>
		</div>
		<button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
	</nav>
	<main>
		{{ if not .IsHome }}
		<h1 class="title">{{ .Title }}</h1>
  		{{ end }}
